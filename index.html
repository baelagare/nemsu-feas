<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071D45" />
    <meta
      name="description"
      content="NEMSU-FEAS — Institutional Faculty Evaluation and Academic Analytics System for North Eastern Mindanao State University – Cantilan Campus."
    />
    <title>NEMSU-FEAS | Faculty Evaluation and Analytics System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#0B2545] selection:text-white">
    <!-- Boot splash: visible until React mounts, then faded out by main.jsx -->
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading NEMSU-FEAS">
      <style>
        #app-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #F8FAFC; font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; }
        #app-splash .s-logo { position: relative; width: 64px; height: 64px; }
        #app-splash .s-ring { position: absolute; inset: 0; border-radius: 20px; background: #0B2545; opacity: .35; animation: s-ring 1.6s cubic-bezier(0,0,.2,1) infinite; }
        #app-splash .s-tile { position: relative; width: 64px; height: 64px; border-radius: 20px; background: #0B2545; color: #F5B800; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; box-shadow: 0 10px 25px -5px rgba(7,29,69,.25); animation: s-float 3s ease-in-out infinite; }
        #app-splash .s-title { margin: 0; color: #0B2545; font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
        #app-splash .s-sub { margin: -12px 0 0; color: #64748B; font-weight: 500; font-size: 12px; }
        #app-splash .s-bar { width: 140px; height: 4px; border-radius: 999px; background: #E2E8F0; overflow: hidden; }
        #app-splash .s-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: #0B2545; animation: s-bar 1.4s cubic-bezier(.65,0,.35,1) infinite; }
        @keyframes s-ring { 0% { transform: scale(.9); opacity: .5; } 100% { transform: scale(1.6); opacity: 0; } }
        @keyframes s-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes s-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
        @media (prefers-reduced-motion: reduce) { #app-splash * { animation: none !important; } }
      </style>
      <div class="s-logo"><div class="s-ring"></div><div class="s-tile">N</div></div>
      <p class="s-title">NEMSU Cantilan</p>
      <p class="s-sub">Faculty Evaluation &middot; FEAS</p>
      <div class="s-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
